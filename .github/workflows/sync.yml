name: Watchlist sync

on:
  schedule:
    - cron: "*/5 * * * *"   # ';' 새 항목 채우기 (+ 필요할 때만 전체 갱신)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 평소처럼, trigger = ';' 항목만, sync = 지금 전체 갱신"
        type: choice
        options: [auto, trigger, sync]
        default: auto
      dry_run:
        description: "노션에 쓰지 않고 바뀔 내용만 보기"
        type: boolean
        default: false

permissions:
  contents: write   # 마지막 전체 갱신 시각(.sync-state.json) 커밋용

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID || secrets.NOTION_PAGE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MODE: ${{ inputs.mode || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FULL_SYNC_EVERY_DAYS: "14"
          FULL_SYNC_STALE_DAYS: "3"
        run: python watchlist_sync.py "$MODE"
      # 전체 갱신 시각을 저장소에 커밋. 이 커밋이 최소 2주마다 생기므로
      # '60일 동안 활동 없는 저장소의 예약 실행 중지'에도 걸리지 않는다.
      - name: Save sync state
        if: always()
        run: |
          if [ -n "$(git status --porcelain .sync-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .sync-state.json
            git commit -m "Full sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
